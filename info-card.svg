<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
<style>
  .bg { fill: #1e1e1e; rx: 8px; }
  .text { font-family: monospace; font-size: 14px; fill: #d4d4d4; }
  .key { fill: #569cd6; font-weight: bold; }
  .title { fill: #4ec9b0; font-weight: bold; }
  .anim { opacity: 0; animation: fadeInSlide 0.5s forwards; }
  @keyframes fadeInSlide {
    from { opacity: 0; transform: translateX(-15px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
<rect class="bg" width="100%" height="100%" />
<text x="20" y="35" class="text title">radu@github ~</text>
<text x="20" y="50" class="text">---------------------------------------</text>
<g class="anim" style="animation-delay: 0.2s;">
  <text x="20" y="85" class="text key">Now</text>
  <text x="120" y="85" class="text">CS Student @ Technical University of Cluj-Napoca</text>
</g>
<g class="anim" style="animation-delay: 0.35s;">
  <text x="20" y="113" class="text key">Prev</text>
  <text x="120" y="113" class="text">AI Training &amp; LLM Evaluation</text>
</g>
<g class="anim" style="animation-delay: 0.5s;">
  <text x="20" y="141" class="text key">Stack</text>
  <text x="120" y="141" class="text">C, C++, Java, Python, VHDL, SQL</text>
</g>
<g class="anim" style="animation-delay: 0.6499999999999999s;">
  <text x="20" y="169" class="text key">Highlights</text>
  <text x="120" y="169" class="text">32-bit MIPS CPU, Budget Management app</text>
</g>
</svg>